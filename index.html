  <div class="note" id="note"></div>
</div>

<div class="card" id="dispCard" hidden>

<div class="card">

    <button class="p" id="gps">📍 Me localiser</button>
  </div>
</div>
</main>

<script>
const CFG = JSON.parse(document.getElementById('config').textContent);
const P = CFG.provinces;
const $ = id => document.getElementById(id);
document.getElementById('appName').textContent = CFG.appName || 'Dispatch';

// Point dans polygone (ray casting) — coordonnées [lon, lat]
function inside(lon, lat, poly){
  let c = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++){
    const [xi, yi] = poly[i], [xj, yj] = poly[j];
    if ((yi > lat) !== (yj > lat) && lon < (xj - xi) * (lat - yi) / (yj - yi) + xi) c = !c;
  }
  return c;
}
function centroid(poly){
  return [poly.reduce((s,p)=>s+p[0],0)/poly.length, poly.reduce((s,p)=>s+p[1],0)/poly.length];
}
function find(lon, lat){
  const hit = P.find(p => inside(lon, lat, p.polygone));
  if (hit) return {p: hit, exact: true};
  let best = null, d = Infinity;
  for (const p of P){
    const [cx, cy] = centroid(p.polygone);
    const dd = (cx - lon) ** 2 + ((cy - lat) * 1.6) ** 2;
    if (dd < d){ d = dd; best = p; }
  }
  return {p: best, exact: false, far: d > 0.5};
}

function show(p, note){
  $('prov').textContent = p.nom;
  $('note').textContent = note || '';
  $('disp').textContent = p.dispatch;
  $('tel').textContent = p.telephone;
  $('dispCard').hidden = false;
  $('sel').value = p.id;
}

function locate(){
  $('prov').textContent = 'Localisation…';
  $('note').textContent = '';
  if (!navigator.geolocation){ $('prov').textContent = 'GPS indisponible'; $('note').textContent = 'Choisissez la province manuellement.'; return; }
  navigator.geolocation.getCurrentPosition(pos => {
    const {latitude: la, longitude: lo, accuracy: ac} = pos.coords;
    const r = find(lo, la);
    if (r.far){ $('prov').textContent = 'Hors de Belgique ?'; $('note').textContent = 'Position hors zone. Choisissez manuellement.'; return; }
    show(r.p, (r.exact ? 'Position détectée' : 'Position proche d’une frontière : vérifiez') + ' (±' + Math.round(ac) + ' m)');
  }, () => {
    $('prov').textContent = 'Position refusée';
    $('note').textContent = 'Autorisez la localisation ou choisissez manuellement.';
  }, {enableHighAccuracy: true, timeout: 15000, maximumAge: 30000});
}

const sel = $('sel');
sel.innerHTML = '<option value="">— Province —</option>' + P.map(p => `<option value="${p.id}">${p.nom}</option>`).join('');
sel.addEventListener('change', () => { const p = P.find(x => x.id === sel.value); if (p) show(p, 'Choix manuel'); });
$('gps').addEventListener('click', locate);
locate();
</script>
